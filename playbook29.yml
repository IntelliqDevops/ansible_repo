---
- name: Error Hadnling or exception handling
  hosts: all
  tasks:
    - block:
        - name: Install git on ubuntu using apt
          apt:
            name: git
            state: present
            update_cache: yes
      rescue:
        - name: Install git on redhat using yum
          yum:
            name: git
            state: present
            update_cache: yes
      always:
        - name: Display success msg
          debug:
            msg: "Git installation succesful"

...
