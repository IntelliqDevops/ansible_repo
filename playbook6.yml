---
- name: Configure apache2
  hosts: all
  tasks:
    - name: Install apache2
      apt:
        name: apache2
        state: present
        update_cache: yes
    - name: Edit the index.html file
      copy:
        content: "Welcome to IntelliQ"
        dest: /var/www/html/index.html
    - name: Restart apache2
      service:
        name: apache2
        state: restarted
    - name: check apache on server1
      uri:
        url: http://20.15.225.119
        status_code: 200
    - name: Check apache on server2
      uri:
        url: http://20.98.128.130
        status_code: 200
...

