---
- name: Check if f1 file is present if not create f1 folder
  hosts: all
  tasks:
    - name: Capture info about f1 file
      stat:
        path: /home/ubuntu/f1
      register: a
    - name: Display output of the above module
      debug:
        var: a
    - name: Check for f1 file and if it is not present create f1 folder
      file:
        name: /home/ubuntu/f1
        state: directory
      when: a.stat.exists == false
...
